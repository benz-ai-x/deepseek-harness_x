# Real Loader composition for the durable Claude Code provider. The application rows
# stay disabled because this fixture inspects registration without starting a turn.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- insert:
    - id: agent-team
      name: '@deepseek-ai/dsh-experimental-agent-team'

    - id: claude-code-catalog-owner
      name: './catalog-owner.ts'

    - id: agent-team-claude-code
      name: '@deepseek-ai/dsh-experimental-agent-team-claude-code'
      config:
        providerName: claude-code-loader
        catalogOwnerService: claudeCodeCatalogOwner
        sandbox: read-only
        maxEvidenceItems: 7
